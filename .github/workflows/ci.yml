# Runs the repository's tests on every pull request and push to master: the build
# script tests (Python, with the small C++ harnesses they compile) and the launcher's
# page and host tests on both platforms it ships for. Game builds need the disc and
# are not run here.
name: CI

on:
  pull_request:
  push:
    # ci/** lets this workflow be tested from a branch before it reaches master.
    branches: [master, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Build scripts (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Test
        run: python3 -m unittest discover -s tests -p test_linux_tools.py -v

  launcher:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: launcher/tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/tauri/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Page tests
        run: npm test

      - name: Host tests and lints
        run: |
          # The generated page and icons (gitignored) are needed to compile the host.
          npm run prepare-ui
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
