# Entry points reached only through an address built in code (lis/addi) or stored in data.
# Each starts directly after the previous function's terminator (blr/bctr/b) with no zero
# padding word, so codegen merges it into that function and never registers it. An
# indirect call then lands in InvalidFunctionTrap: a silent no-op on Windows (r3 left
# stale), REX_FATAL on Linux. Found by sweeping the base disc executable for code
# addresses built with lis+addi/ori or stored in data, minus registered starts, internal
# labels, jump tables and exception data. Relocated update entries: see ../../title_updates/update.

# Functor thunk (lwz r11,0(r3); mr r10,r3; addi r3,r11,12; ...; mtctr r11; bctr), right after
# the thunk at 0x8253D528 whose bctr ends on a 16-byte boundary. The getter at 0x8253D9E0
# returns it and the constructor at 0x8253DCB8 stores it as a functor's invoke pointer.
# Upstream needed it to switch to a non-default hero (without it the hero load never runs).
[functions."0x8253D550"]
size = 0x2C

