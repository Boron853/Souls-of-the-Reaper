# ReXGlue 0.10 codegen manifest for the unmodified USA Ultimate Evil Edition disc
# (Default.xex SHA-256 cc918a70940517f974d0fd60d4936c8236e8dc21130cf4a8b8ae915451c289ef).
# build.ps1 writes a copy with your game folder (local_manifest.toml) and runs codegen on that.
[project]
name = "diablo3"
sdk_version = "0.10.0"
game_root = "../game"

[entrypoint]
# Linux file systems are case-sensitive; the extracted disc file is default.xex.
file_path = "../game/default.xex"
out_directory_path = "generated/default"
includes = ["config/thunks.toml", "config/callbacks.toml", "config/leaf-functions.toml"]
